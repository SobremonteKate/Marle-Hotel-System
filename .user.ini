; Per-directory PHP production settings (read by PHP-FPM/CGI and Apache mod_php
; with .user.ini support). Complements .htaccess: these cover values that
; php_flag cannot set in PHP 8+ under Apache.
;
; XAMPP ships display_errors=On in php.ini, which would leak paths, SQL and
; config details through the ngrok tunnel or any public deployment. These
; settings win over the global php.ini for this directory tree.

; Never print errors into responses.
display_errors = Off
display_startup_errors = Off

; Log them to file instead. On InfinityFree adjust the path to an absolute
; path inside your account (e.g. /home/volX_XXXX/error.log); on XAMPP the
; default php.ini error_log target is used when this is empty.
log_errors = On

; Production-appropriate reporting: everything except deprecated notices,
; which older PHP versions on shared hosts emit for perfectly valid code.
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; The hotel is in the Philippines. config.php sets this too, for every request
; that loads it; this line covers the requests that do not (and CLI/FPM paths
; on the host), so no entry point can fall back to the server's own zone.
; date.timezone is PHP_INI_ALL, so a per-directory file may set it.
date.timezone = Asia/Manila

